name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - name: Test dependency-free roster card
        run: node tests/frontend_test.js

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The action reads these files from unauthenticated raw GitHub URLs,
          # which cannot access this private repository. Brands submission is
          # also intentionally deferred until approval for public release.
          ignore: brands hacsjson integration_manifest
